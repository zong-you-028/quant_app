services:
  - type: web
    name: quant-app
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:

      - key: FLET_FORCE_WEB_SERVER
        value: "true"
      - key: FLET_SERVER_IP
        value: 0.0.0.0
      - key: FLET_SERVER_PORT
        value: "10000"
      - key: FINMIND_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: JOURNAL_DATABASE_URL
        sync: false

